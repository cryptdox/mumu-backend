name: Test, build & publish

# Push to main      → test, build, push :latest + :sha-<short> to Docker Hub, redeploy Render (if hook set)
# Tag v1.2.3        → test, build, push :1.2.3 + :1.2
# Pull request      → test + build only (nothing pushed)
#
# Repo secrets:   DOCKER_USERNAME, DOCKER_PASSWORD (Docker Hub access token), RENDER_DEPLOY_HOOK (optional)
# Repo variable:  DOCKERHUB_IMAGE (optional, default abir71hosen/mumu-backend)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'abir71hosen/mumu-backend' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mu
          POSTGRES_PASSWORD: mu
          POSTGRES_DB: mu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mu" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI values — the suite refuses non-local hosts, simulates IAM in this
      # Redis, stores images on disk and runs its own fake MUMU RTC on port 47123.
      NODE_ENV: test
      DATABASE_URL: postgresql://mu:mu@localhost:5432/mu_test
      IAM_REDIS_URL: redis://localhost:6379
      IAM_CLIENT_ID: mu
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /tmp/mu-test-media
      MUMU_RTC_URL: http://127.0.0.1:47123
      MUMU_RTC_API_KEY: mk_test
      MUMU_RTC_API_SECRET: ms_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - name: API + realtime tests
        run: pnpm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null && echo "Render deploy triggered"
